<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minutnik Pomodoro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">Tryb skupienia</p>
      <h1>Minutnik</h1>
    </header>

    <section class="timer-card" aria-live="polite">
      <p id="phaseLabel" class="phase">Praca</p>
      <div id="timeDisplay" class="time">25:00</div>
      <div class="cycle">Cykl <strong id="cycleCount">0</strong> / 4</div>
      <div class="progress-track" aria-hidden="true">
        <div id="progressBar" class="progress"></div>
      </div>
    </section>

    <section class="controls" aria-label="Sterowanie minutnikiem">
      <button id="startButton" class="primary" type="button">Start</button>
      <button id="pauseButton" type="button" disabled>Pauza</button>
      <button id="resetButton" type="button">Reset</button>
    </section>

    <p id="status" class="status">Gotowy do pracy.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
